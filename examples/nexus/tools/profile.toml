name = "profile"
description = "Summarize one vault page from its frontmatter: counts, years, outputs by year, identifiers (ORCID, OpenAlex, Scholars@UK) and related pages grouped by type. Faster and more reliable than reading the whole page."
command = ["python3", "{package}/tools/vault.py", "profile"]

[parameters]
type = "object"
required = ["slug"]

[parameters.properties.slug]
type = "string"
description = "A page slug such as person-frederick-a-schmitt or topic-alzheimer-disease"
