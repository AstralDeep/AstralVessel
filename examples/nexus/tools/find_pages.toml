name = "find_pages"
description = "Find vault pages whose name matches every word of the query (prefix match), e.g. 'frederick schmitt' or 'alzheimer'. Returns slugs, titles and publication counts. Use this before reading or profiling a page."
command = ["python3", "{package}/tools/vault.py", "find_pages"]

[parameters]
type = "object"
required = ["query"]

[parameters.properties.query]
type = "string"

[parameters.properties.type]
type = "string"
enum = ["person", "topic", "method", "organization", "grant", "publication", "facility", "initiative"]
description = "Only return pages of this type"

[parameters.properties.limit]
type = "integer"
description = "Default 25"
