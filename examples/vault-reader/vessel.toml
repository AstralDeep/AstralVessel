[agent]
name = "vault-reader"
description = "Looks up pages in the ccts-kg vault and quotes them, with read-only file tools and no shell or web access."
version = "0.1.0"
examples = ["What does the vault say about the Sanders-Brown Center on Aging?"]

[model]
endpoint = "env:VESSEL_MODEL_URL"
api_key = "env:VESSEL_MODEL_KEY"
model = "zai-org/GLM-5.3-Flash"
temperature = 0.1
max_steps = 12

[tools]
builtin = ["read", "grep", "glob", "list"]

[sandbox]
workdir = "/vault"
mounts = [{ source = "vault", target = "/vault", read_only = true }]
deadline_seconds = 300
tool_timeout_seconds = 30
