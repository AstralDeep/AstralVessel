[agent]
name = "field-guide-reader"
description = "Quotes pages from the sample field guide, with read-only file tools and no shell or web access."
version = "0.1.0"
examples = ["What does the guide say about the kingfisher's nest?"]

[model]
endpoint = "env:VESSEL_MODEL_URL"
api_key = "env:VESSEL_MODEL_KEY"
model = "zai-org/GLM-5.3-Flash"
temperature = 0.1
max_steps = 10

[tools]
builtin = ["read", "grep", "glob", "list"]

[sandbox]
workdir = "/data"
mounts = [{ source = "guide", target = "/data", read_only = true }]
deadline_seconds = 120
tool_timeout_seconds = 20
