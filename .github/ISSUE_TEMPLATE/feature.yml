name: Feature request
description: A capability AstralVessel should have.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A few checkable acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed design
      description: Optional. Sketch the approach when the approach itself needs a decision.
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
