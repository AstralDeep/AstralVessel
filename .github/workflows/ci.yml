# Lint, the test suite on each supported Python, both images, and the example's Compose generation, on every pull
# request and every push to main. It needs no secrets: the tests use a scripted model. Hosted kernels lack Landlock
# ABI 6, so confinement tests skip here and the full isolation run stays a maintainer step (README, Contributing).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRALPRIMS: "astralprims @ git+https://github.com/AstralDeep/AstralPrimitives@d7b454105ec910cb1734fab6f7e318ac29185873"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.4
      - run: ruff check .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends ripgrep
      - run: pip install -e . pytest==9.2.0 pytest-asyncio==1.4.1.post1 "$ASTRALPRIMS"
      - run: python -m pytest -q -rs

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: docker build -t astralvessel:local .
      - run: docker build -t astralvessel-egress:local egress
      - run: pip install -e .
      - name: Generate and validate the example's Compose file
        working-directory: deploy
        run: |
          printf '%s\n' VESSEL_UPSTREAM_MODEL_KEY=ci VESSEL_APP_KEY=ci VESSEL_APP_KEY_SHA256=ci \
            VESSEL_SANDBOX_TOKEN=ci-sandbox-token > ci.env
          astralvessel deploy deployment.toml --env-file ci.env
          docker compose -f compose.generated.yml --env-file ci.env config --quiet
