# An AstralVessel deployment: harness, sandbox, egress, and the demo app in front.
# The harness and sandbox sit on internal networks with no route out; egress is the only door.
name: astralvessel

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  egress:
    <<: *hardened
    build: ../egress
    environment:
      LLM_BASE_URL: ${VESSEL_UPSTREAM_MODEL_URL:-https://api-llm-factory.ai.uky.edu/v1}
      LLM_API_KEY: ${VESSEL_UPSTREAM_MODEL_KEY:?set VESSEL_UPSTREAM_MODEL_KEY in deploy/.env}
    networks: [egress, outside]
    mem_limit: 512m
    pids_limit: 128

  sandbox:
    <<: *hardened
    build: ..
    command: ["astralvessel", "sandbox"]
    environment:
      VESSEL_PACKAGE: /agent
      VESSEL_SANDBOX_TOKEN: ${VESSEL_SANDBOX_TOKEN:?set VESSEL_SANDBOX_TOKEN in deploy/.env}
      VESSEL_PORT: "8710"
    volumes:
      - ${VESSEL_AGENT_DIR:-../examples/nexus}:/agent:ro
      - ${VESSEL_VAULT_DIR:?set VESSEL_VAULT_DIR in deploy/.env}:/vault:ro
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev,mode=1777
    networks: [tools]
    mem_limit: 4g
    cpus: 4
    pids_limit: 512

  vessel:
    <<: *hardened
    build: ..
    environment:
      VESSEL_PACKAGE: /agent
      VESSEL_APP_KEY_SHA256: ${VESSEL_APP_KEY_SHA256:?set VESSEL_APP_KEY_SHA256 in deploy/.env}
      VESSEL_MODEL_URL: http://egress:8080/v1
      VESSEL_MODEL_KEY: via-egress
      VESSEL_WEB_PROXY: http://egress:3128
      VESSEL_SANDBOX_URL: http://sandbox:8710
      VESSEL_SANDBOX_TOKEN: ${VESSEL_SANDBOX_TOKEN}
      VESSEL_STORE: /data/vessel.sqlite
      VESSEL_PUBLIC_URL: http://vessel:8700
      # Listen only on the front network, so the sandbox (which shares the tools network) cannot reach the API.
      VESSEL_HOST: 172.31.247.10
    volumes:
      - ${VESSEL_AGENT_DIR:-../examples/nexus}:/agent:ro
      - vessel_data:/data
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev,mode=1777
    networks:
      front: { ipv4_address: 172.31.247.10 }
      tools: {}
      egress: {}
    mem_limit: 1g
    pids_limit: 256
    depends_on: [egress, sandbox]

  demo:
    <<: *hardened
    build:
      context: ..
      dockerfile: demo/Dockerfile
    environment:
      VESSEL_URL: http://vessel:8700
      VESSEL_APP_KEY: ${VESSEL_APP_KEY:?set VESSEL_APP_KEY in deploy/.env}
    networks: [front, outside]
    ports:
      - "127.0.0.1:${DEMO_PORT:-8790}:8790"
      - "${DEMO_TAILSCALE_IP:-127.0.0.1}:${DEMO_PORT:-8790}:8790"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev,mode=1777
    mem_limit: 512m
    depends_on: [vessel]

networks:
  tools: { internal: true }
  egress: { internal: true }
  front:
    internal: true
    ipam: { config: [{ subnet: 172.31.247.0/24 }] }
  outside: {}

volumes:
  vessel_data:
