[project]
name = "astralvessel"
version = "0.6.0"
description = "The base AstralDeep node with its command-line tools and a ticket-checking sandbox executor."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Evan Damron" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "cryptography>=43",
  "httpx>=0.27",
  "pydantic>=2.7",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/AstralDeep/AstralVessel"
Documentation = "https://astraldeep.github.io/AstralVessel/"
Issues = "https://github.com/AstralDeep/AstralVessel/issues"
Changelog = "https://astraldeep.github.io/AstralVessel/changelog/"

[project.scripts]
astralvessel = "astralvessel.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astralvessel"]

# The example agent and its data ship in the package, so astralvessel up --example needs no checkout.
[tool.hatch.build.targets.wheel.force-include]
"examples/field-guide" = "astralvessel/example/field-guide"
"examples/sample-data" = "astralvessel/example/sample-data"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
