[project]
name = "astralvessel"
version = "0.4.0"
description = "A lightweight, open agent harness and standard that speaks the Astral protocols."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Evan Damron" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "a2a-sdk[http-server,sqlite]==1.2.2",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "pydantic>=2.7",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
primitives = ["astralprims>=0.12,<1"]

[project.urls]
Repository = "https://github.com/AstralDeep/AstralVessel"

[project.scripts]
astralvessel = "astralvessel.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astralvessel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
